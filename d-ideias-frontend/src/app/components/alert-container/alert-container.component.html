@if (alerts().length > 0) {
  <section
    class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-3"
  >
    @for (alert of alerts(); track alert.id) {
      <article
        class="pointer-events-auto rounded-2xl border px-4 py-3 shadow-xl shadow-slate-950/30 backdrop-blur"
        [ngClass]="{
          'border-emerald-400/40 bg-emerald-950/50 text-emerald-100': alert.type === 'success',
          'border-rose-400/40 bg-rose-950/50 text-rose-100': alert.type === 'error',
        }"
      >
        <div class="flex items-start justify-between gap-3">
          <div>
            <h3 class="text-sm font-semibold">{{ alert.title }}</h3>
            <p class="mt-1 text-sm leading-6 opacity-90">{{ alert.message }}</p>
          </div>
          <button
            type="button"
            class="rounded-full border border-white/20 px-2 py-1 text-xs font-medium transition hover:border-white/40"
            (click)="dismiss(alert.id)"
          >
            Fechar
          </button>
        </div>
      </article>
    }
  </section>
}
