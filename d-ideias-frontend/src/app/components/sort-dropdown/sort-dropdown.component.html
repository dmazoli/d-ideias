<div class="relative z-[100] inline-block">
  <button
    (click)="toggleDropdown()"
    class="flex items-center gap-2 rounded-full border border-white/10 bg-slate-800 px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-cyan-400/50 hover:text-cyan-200"
  >
    <fa-icon [icon]="faSortAmountDown" class="text-sm"></fa-icon>
    <span class="font-medium">Ordenar</span>
    <fa-icon
      [icon]="faChevronDown"
      class="text-sm transition-transform"
      [ngClass]="{ 'rotate-180': isOpen }"
    ></fa-icon>
  </button>

  @if (isOpen) {
    <div
      class="absolute right-0 top-full z-[100] mt-2 min-w-56 rounded-lg border border-white/10 bg-slate-900 shadow-lg shadow-slate-950/60"
    >
      @for (option of sortOptions; track option.value) {
        <button
          (click)="selectSort(option.value)"
          [ngClass]="{
            'border-l-2 border-l-cyan-400 bg-cyan-400/10 text-cyan-200 z-[100]':
              currentSort() === option.value,
          }"
          class="w-full px-4 py-2 text-left text-slate-200 transition hover:bg-white/5 first:rounded-t-lg last:rounded-b-lg"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
