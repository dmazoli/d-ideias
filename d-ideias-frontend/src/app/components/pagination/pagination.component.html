<div class="flex items-center justify-center gap-4 py-4">
  <button (click)="onPreviousPage()" [disabled]="isPreviousDisabled()"
    class="flex items-center justify-center w-10 h-10 rounded-lg text-slate-400 transition-colors disabled:border-slate-200 disabled:opacity-50 disabled:text-slate-900 disabled:cursor-not-allowed hover:enabled:bg-slate-800"
    aria-label="Página anterior">
    <fa-icon [icon]="faChevronLeft" class="text-sm"></fa-icon>
  </button>

  <span class="text-slate-700 font-medium"> Página {{ meta().page }} de {{ totalPages() }} </span>

  <button (click)="onNextPage()" [disabled]="isNextDisabled()"
    class="flex items-center justify-center w-10 h-10 rounded-lg text-slate-400 transition-colors disabled:border-slate-200 disabled:opacity-50 disabled:text-slate-900 disabled:cursor-not-allowed hover:enabled:bg-slate-800"
    aria-label="Próxima página">
    <fa-icon [icon]="faChevronRight" class="text-sm"></fa-icon>
  </button>
</div>
