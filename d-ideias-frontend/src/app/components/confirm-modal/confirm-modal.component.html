<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm">
  <div
    class="w-full max-w-md rounded-[28px] border border-white/10 bg-slate-900 p-6 shadow-2xl shadow-slate-950/40"
  >
    <h2 class="text-lg font-semibold text-white">Confirmar exclusão</h2>
    <p class="mt-2 text-sm leading-6 text-slate-300">{{ message() }}</p>
    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        (click)="handleCancel()"
        class="rounded-full border border-white/10 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-cyan-400/50 hover:text-cyan-200"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="handleConfirm()"
        class="rounded-full border border-rose-400/50 bg-rose-950/40 px-4 py-2 text-sm font-medium text-rose-200 transition hover:border-rose-400/80 hover:text-rose-100"
      >
        Confirmar exclusão
      </button>
    </div>
  </div>
</div>
