<section class="min-w-0 space-y-6">
  <div
    class="flex flex-col gap-4 rounded-[28px] border border-white/10 bg-slate-900/80 p-5 shadow-xl shadow-slate-950/20 backdrop-blur sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <h2 class="text-xl font-semibold text-white">Cards de ideias</h2>
      <p class="mt-1 text-sm text-slate-400">
        Registre aqui sua ideia para melhorar nossos serviços.
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <button
        class="rounded-full border border-white/10 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-cyan-400/50 hover:text-cyan-200"
      >
        Mais recentes
      </button>
      <a
        routerLink="/new"
        class="rounded-full bg-white px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-cyan-200"
      >
        Nova ideia
      </a>
    </div>
  </div>

  <div class="grid gap-5 lg:grid-cols-2 2xl:grid-cols-3">
    @for (idea of ideas(); track idea.id) {
      <app-idea-card [idea]="idea"></app-idea-card>
    }
  </div>
</section>
