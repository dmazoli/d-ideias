<aside
  class="rounded-[28px] border border-white/10 bg-slate-900/80 p-5 shadow-xl shadow-slate-950/20 backdrop-blur"
>
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-semibold text-white">Resumo</h2>
    <a
      routerLink="/new"
      class="rounded-full border border-white/10 px-3 py-1 text-xs font-medium text-slate-300 transition hover:border-cyan-400/50 hover:text-cyan-200"
    >
      Nova ideia
    </a>
  </div>

  <div class="mt-6 space-y-5">
    <div class="rounded-3xl border border-emerald-400/20 bg-emerald-400/10 p-4">
      <div class="text-xs uppercase tracking-[0.28em] text-emerald-200">Fluxo</div>
      <p class="mt-3 text-sm leading-6 text-emerald-50/90">
        A listagem fica na rota raiz e cada card leva para uma rota de edicao baseada no id da
        ideia.
      </p>
    </div>

    <div class="space-y-3">
      <span class="text-xs uppercase tracking-[0.28em] text-slate-500">Campos do model</span>
      <div class="mt-2 grid gap-3 sm:grid-cols-1">
        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-4">
          <div class="text-xs uppercase tracking-[0.28em] text-slate-500">Ideias ativas</div>
          <div class="mt-3 text-3xl font-semibold text-white">{{ ideasCount() }}</div>
          <div class="mt-2 text-sm text-emerald-300">Mocks disponiveis</div>
        </div>

        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-4">
          <div class="text-xs uppercase tracking-[0.28em] text-slate-500">Status da fonte</div>
          <div class="mt-3 text-3xl font-semibold text-white">{{ status() }}</div>
          <div class="mt-2 text-sm text-amber-300">Estado compartilhado</div>
        </div>

        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-4">
          <div class="text-xs uppercase tracking-[0.28em] text-slate-500">Rota edicao</div>
          <div class="mt-3 text-3xl font-semibold text-white">/edit/:id</div>
          <div class="mt-2 text-sm text-cyan-300">Mesmo componente</div>
        </div>
      </div>
    </div>
  </div>
</aside>
