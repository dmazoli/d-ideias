<main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-8 px-6 py-8 lg:px-10">
  <section
    class="rounded-[32px] border border-white/10 bg-white/5 px-6 py-6 shadow-2xl shadow-slate-950/30 backdrop-blur xl:px-8"
  >
    <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
      <div class="space-y-3">
        <a
          routerLink="/"
          class="inline-flex items-center gap-2 rounded-full border border-white/10 px-3 py-1 text-xs font-medium uppercase tracking-[0.32em] text-slate-300 transition hover:border-cyan-400/50 hover:text-cyan-200"
        >
          Voltar para listagem
        </a>
        <div>
          <h1 class="text-4xl font-semibold tracking-tight text-white">{{ pageTitle() }}</h1>
          <p class="mt-2 max-w-2xl text-sm leading-7 text-slate-300 sm:text-base">
            {{
              isEditMode()
                ? 'Revise os dados da ideia selecionada.'
                : 'Preencha os campos para cadastrar uma nova ideia.'
            }}
          </p>
        </div>
      </div>
    </div>
  </section>

  <form
    [formGroup]="form"
    (ngSubmit)="handleSubmit()"
    class="grid gap-6 rounded-[32px] border border-white/10 bg-slate-900/80 p-6 shadow-xl shadow-slate-950/20 backdrop-blur"
  >
    <div class="grid gap-6 md:grid-cols-2">
      <label class="space-y-2 text-sm text-slate-300">
        <span class="flex items-center gap-2 text-xs uppercase tracking-[0.28em] text-slate-500">
          <span>Numero de Registro (RE)</span>
          <span class="tooltip-trigger" tabindex="0" aria-label="Descricao do campo">
            <fa-icon [icon]="faCircleInfo" class="cursor-help text-slate-400"></fa-icon>
            <span class="tooltip-content"
              >Numero de Registro (RE) do colaborador que esta contribuindo com a ideia.</span
            >
          </span>
        </span>
        <input
          type="number"
          formControlName="authorRegister"
          class="w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-white outline-none transition focus:border-cyan-400/50"
        />
      </label>

      <label class="space-y-2 text-sm text-slate-300">
        <span class="flex items-center gap-2 text-xs uppercase tracking-[0.28em] text-slate-500">
          <span>Data de registro da ideia</span>
          <span class="tooltip-trigger" tabindex="0" aria-label="Descricao do campo">
            <fa-icon [icon]="faCircleInfo" class="cursor-help text-slate-400"></fa-icon>
            <span class="tooltip-content">Data em que foi preenchida a ideia.</span>
          </span>
        </span>
        <input
          type="text"
          [value]="registrationDate()"
          readonly
          class="w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-white outline-none"
        />
      </label>

      <label class="space-y-2 text-sm text-slate-300 md:col-span-2">
        <span class="flex items-center gap-2 text-xs uppercase tracking-[0.28em] text-slate-500">
          <span>O que pode ser melhorado</span>
          <span class="tooltip-trigger" tabindex="0" aria-label="Descricao do campo">
            <fa-icon [icon]="faCircleInfo" class="cursor-help text-slate-400"></fa-icon>
            <span class="tooltip-content"
              >Descricao textual do que pode ser melhorado na empresa.</span
            >
          </span>
        </span>
        <input
          type="text"
          formControlName="improvementSuggestion"
          class="w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-white outline-none transition focus:border-cyan-400/50"
        />
      </label>

      <label class="space-y-2 text-sm text-slate-300 md:col-span-2">
        <span class="flex items-center gap-2 text-xs uppercase tracking-[0.28em] text-slate-500">
          <span>Como e feito hoje</span>
          <span class="tooltip-trigger" tabindex="0" aria-label="Descricao do campo">
            <fa-icon [icon]="faCircleInfo" class="cursor-help text-slate-400"></fa-icon>
            <span class="tooltip-content"
              >Descricao textual de como o processo a ser melhorado esta sendo feito hoje.</span
            >
          </span>
        </span>
        <textarea
          rows="4"
          formControlName="currentProcess"
          class="w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-white outline-none transition focus:border-cyan-400/50"
        ></textarea>
      </label>

      <label class="space-y-2 text-sm text-slate-300 md:col-span-2">
        <span class="flex items-center gap-2 text-xs uppercase tracking-[0.28em] text-slate-500">
          <span>Como pode ser melhorado</span>
          <span class="tooltip-trigger" tabindex="0" aria-label="Descricao do campo">
            <fa-icon [icon]="faCircleInfo" class="cursor-help text-slate-400"></fa-icon>
            <span class="tooltip-content"
              >Descricao textual de como a melhoria deve ser implementada.</span
            >
          </span>
        </span>
        <textarea
          rows="4"
          formControlName="howToImplement"
          class="w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-white outline-none transition focus:border-cyan-400/50"
        ></textarea>
      </label>

      <label class="space-y-2 text-sm text-slate-300 md:col-span-2">
        <span class="flex items-center gap-2 text-xs uppercase tracking-[0.28em] text-slate-500">
          <span>Qual e o beneficio</span>
          <span class="tooltip-trigger" tabindex="0" aria-label="Descricao do campo">
            <fa-icon [icon]="faCircleInfo" class="cursor-help text-slate-400"></fa-icon>
            <span class="tooltip-content">Beneficio esperado pela melhoria proposta.</span>
          </span>
        </span>
        <textarea
          rows="4"
          formControlName="expectedBenefits"
          class="w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-white outline-none transition focus:border-cyan-400/50"
        ></textarea>
      </label>
    </div>

    <div
      class="flex flex-col gap-4 border-t border-white/10 pt-6 sm:flex-row sm:items-center sm:justify-between"
    >
      <div class="flex flex-wrap gap-3">
        <a
          routerLink="/"
          class="rounded-full border border-white/10 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-cyan-400/50 hover:text-cyan-200"
        >
          Cancelar
        </a>
        <button
          type="submit"
          class="rounded-full bg-white px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-cyan-200"
        >
          {{ submitLabel() }}
        </button>
      </div>
    </div>
  </form>
</main>
