volumes:
  db_data:


networks:
  d-ideias-network:


services:
  db:
    image: postgres:latest
    container_name: d-ideias-db
    environment:
      POSTGRES_DB: d_ideias
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
    env_file:
      - .env
    networks:
      - d-ideias-network
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"

  api:
    build:
      context: ./d-ideias-backend
      dockerfile: Dockerfile
    container_name: d-ideias-api
    command: sh -c "npm run migration:run && npm run start:dev"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - d-ideias-network
    ports:
      - "3000:3000"
    volumes:
      - ./d-ideias-backend:/app
      - ./d-ideias-backend/node_modules:/app/node_modules

  frontend:
    build:
      context: ./d-ideias-frontend
      dockerfile: Dockerfile
    container_name: d-ideias-frontend
    command: npm run start -- --host 0.0.0.0 --port 4200
    depends_on:
      api:
        condition: service_started
    networks:
      - d-ideias-network
    ports:
      - "4200:4200"
    volumes:
      - ./d-ideias-frontend:/app
      - ./d-ideias-frontend/node_modules:/app/node_modules
